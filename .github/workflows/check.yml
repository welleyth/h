name: check

on:
  push: { branches: [ main ] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            gcov: gcov
          - compiler: clang++
            gcov: llvm-cov gcov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y llvm
        if: matrix.compiler == 'clang++'
      - run: sudo locale-gen de_DE.UTF-8
      - run: make -j"$(nproc)" check
        env:
          CXX: ${{ matrix.compiler }}
          GCOV: ${{ matrix.gcov }}

  musl:
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - run: apk add --no-cache g++ make python3 git go clang
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make -j"$(nproc)" check

  gcc9:
    runs-on: ubuntu-latest
    container: gcc:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make -j"$(nproc)" test hostile examples

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make -j"$(sysctl -n hw.ncpu)" check

  transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make transcript
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcript-linux
          path: build/transcript.txt

  windows:
    needs: transcript
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [ mingw, cl, cl-x86, clang-cl ]
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transcript-linux
          path: build/linux
      - name: Take the compiler from the Visual Studio developer prompt
        if: matrix.compiler != 'mingw'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set studio=%%i
          set target=x64
          if "${{ matrix.compiler }}"=="cl-x86" set target=x86
          call "%studio%\VC\Auxiliary\Build\vcvarsall.bat" %target% > nul
          echo PATH=%PATH%>> "%GITHUB_ENV%"
          echo INCLUDE=%INCLUDE%>> "%GITHUB_ENV%"
          echo LIB=%LIB%>> "%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>> "%GITHUB_ENV%"
      - name: Build with ${{ matrix.compiler }}
        run: |
          if [ "${{ matrix.compiler }}" = mingw ]; then
            CXX=g++ EXTRA=-static sh tests/windows/build.sh build/transcript
          else
            PATH="$(dirname "$(command -v cl)"):$PATH" CXX=${{ matrix.compiler == 'cl-x86' && 'cl' || matrix.compiler }} \
              sh tests/windows/build.sh build/transcript msvc
          fi
      - run: sh tests/windows/transcript.sh build/transcript > build/transcript.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: transcript-windows-${{ matrix.compiler }}
          path: build/transcript.txt
      - name: Every scenario gives the bytes it gives on Linux
        run: diff -u build/linux/transcript.txt build/transcript.txt
      - name: The unit tests pass on Windows
        run: env -u TMPDIR build/transcript/tests.exe
      - name: eo-judge built for Windows points at WSL2
        if: matrix.compiler == 'mingw'
        run: |
          (cd judge && go build -o ../build/eo-judge.exe .)
          if build/eo-judge.exe version 2> build/refused.txt; then exit 1; fi
          grep -q 'Install WSL2' build/refused.txt
      - name: A program builds and runs with <windows.h> before or after the headers
        run: |
          for program in windows_first windows_last; do
            printf '5\n' | "build/transcript/$program.exe"
          done

  judge:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: judge/go.mod
          cache: false
      - id: go
        run: echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/eo-judge
            ${{ steps.go.outputs.cache }}
          key: judge-${{ runner.os }}-${{ hashFiles('judge/go.mod', 'judge/*.go', 'judge/templates/**', 'judge/testdata/**', 'tests/live/**', 'eolymp.h', 'eolymp-shapes.h') }}
          restore-keys: judge-${{ runner.os }}-
      - run: |
          echo "EO_JUDGE_CACHE=$HOME/.cache/eo-judge" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/judge-started"
      - run: make judge
      - name: Keep only the programs this run used
        run: |
          [ -d "$EO_JUDGE_CACHE" ] || exit 0
          find "$EO_JUDGE_CACHE" -mindepth 2 -maxdepth 2 -type d ! -path "$EO_JUDGE_CACHE/include/*" ! -newer "$RUNNER_TEMP/judge-started" |
            while read -r entry; do rm -rf "$entry" "$entry.lock"; done

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make version BASE=${{ github.event.pull_request.base.sha }}

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make sanitize

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make mutants

  release:
    needs: [ linux, musl, gcc9, macos, transcript, windows, judge, sanitize, mutants ]
    if: github.repository == 'eolymp/h' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        id: read
        run: |
          version=$(python3 tools/version.py --print)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish headers that are not what src/ generates
        run: python3 tools/amalgamate.py --check

      - name: Release, unless this version already has one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            exit 0
          fi
          awk -v heading="## $VERSION" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            set -- --notes-file notes.md
          else
            set -- --generate-notes
          fi
          if ! gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "eolymp.h $VERSION" \
            "$@" \
            eolymp.h eolymp-shapes.h; then
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION was released by another run meanwhile; nothing to do."
              exit 0
            fi
            exit 1
          fi
          echo "released v$VERSION"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: judge/go.mod
          cache: false

      - name: Release eo-judge, unless this version already has one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          tag="judge/v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              (cd judge && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -o "../dist/eo-judge-$os-$arch" .)
            done
          done
          (cd dist && sha256sum eo-judge-* > SHA256SUMS)
          previous=$(gh release list --limit 1000 --json tagName \
            --jq '[.[].tagName | select(startswith("judge/v"))][0] // ""')
          if [ -n "$previous" ]; then
            set -- --generate-notes --notes-start-tag "$previous"
          else
            set -- --notes "The first release of eo-judge."
          fi
          if ! gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "eo-judge $VERSION" \
            "$@" \
            --latest=false \
            dist/*; then
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag was released by another run meanwhile; nothing to do."
              exit 0
            fi
            exit 1
          fi
          echo "released $tag"
